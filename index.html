    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* https://*; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: http://localhost:* https://*; style-src 'self' 'unsafe-inline' http://localhost:* https://*; font-src 'self' data: http://localhost:* https://*; img-src 'self' data: blob: http://localhost:* https://*; media-src 'self' data: blob: http://localhost:* https://*; frame-src 'self' blob: data: http://localhost:* https://*; connect-src 'self' data: blob: ws://localhost:* wss://localhost:* ws://127.0.0.1:* http://127.0.0.1:* wss://demos.yjs.dev http://localhost:* https://*; worker-src 'self' blob: http://localhost:* https://*;" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (typeof message === 'string' && message.includes('ResizeObserver')) {
          console.warn(message);
          return true; // prevent default error handling (no alert popup)
        }
        alert("🚨 [AMEVA Runtime Error]\n\n" + message + "\n\nFile: " + source + "\nLine: " + lineno + ":" + colno + "\n\nStack:\n" + (error ? error.stack : 'N/A'));
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        alert("🚨 [AMEVA Unhandled Rejection]\n\nReason: " + event.reason + "\n\nStack:\n" + (event.reason ? event.reason.stack : 'N/A'));
      });
    </script>
    <title>AMEVA Markdown Editor &amp; Viewer</title>
