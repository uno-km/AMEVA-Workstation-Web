<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Clear Aqua Cyan to Electric Sky Blue -->
    <linearGradient id="cyan-sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3A86FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="480" rx="32" fill="url(#bg-grad-dark)" stroke="rgba(0, 245, 212, 0.15)" stroke-width="2" />

  <!-- SYMBOL GROUP (Left Side) -->
  <g transform="translate(40, 0)">
    <!-- Outer Organic Fluid Universe Ring -->
    <path d="M 240 96 
             C 324 96, 384 156, 384 240 
             C 384 324, 324 384, 240 384 
             C 156 384, 96 324, 96 240 
             C 96 156, 156 96, 240 96 Z" 
          fill="none" 
          stroke="url(#cyan-sky-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          opacity="0.4" />

    <!-- SKELETON CONNECTIONS -->
    <!-- [1] Root -> [1-1] -> [1-1-1] -->
    <line x1="240" y1="130" x2="182" y2="250" stroke="url(#cyan-sky-grad)" stroke-width="16" stroke-linecap="round" />
    <line x1="182" y1="250" x2="145" y2="350" stroke="url(#cyan-sky-grad)" stroke-width="16" stroke-linecap="round" />

    <!-- ⭐ NEW LONGER INWARD ORGANIC BRANCH: Node [1-1] -> [1-1-2] (Inward Right-Downward) -->
    <line x1="182" y1="250" x2="232" y2="324" stroke="url(#cyan-sky-grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="6 3" />

    <!-- [1] Root -> [1-2] -> [1-2-1] -->
    <line x1="240" y1="130" x2="298" y2="250" stroke="url(#cyan-sky-grad)" stroke-width="16" stroke-linecap="round" />
    <line x1="298" y1="250" x2="335" y2="350" stroke="url(#cyan-sky-grad)" stroke-width="16" stroke-linecap="round" />

    <!-- Crossbar -->
    <line x1="182" y1="250" x2="298" y2="250" stroke="url(#cyan-sky-grad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />

    <!-- NODES -->
    <!-- [1] Root Node -->
    <circle cx="240" cy="130" r="28" fill="url(#node-glow)" />
    <circle cx="240" cy="130" r="14" fill="#FFFFFF" stroke="#00F5D4" stroke-width="3" />

    <!-- [1-1] Middle Left -->
    <circle cx="182" cy="250" r="18" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- [1-1-1] Bottom Left -->
    <circle cx="145" cy="350" r="22" fill="#00F5D4" />

    <!-- ⭐ [1-1-2] Longer Inward Pseudopod Node -->
    <circle cx="232" cy="324" r="15" fill="#00F5D4" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- [1-2] Middle Right -->
    <circle cx="298" cy="250" r="16" fill="#38BDF8" />

    <!-- [1-2-1] Bottom Right -->
    <circle cx="335" cy="350" r="22" fill="#3A86FF" />
  </g>

  <!-- LOGO TYPOGRAPHY GROUP (Right Side) -->
  <g transform="translate(480, 260)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="110" font-weight="900" letter-spacing="12" fill="#FFFFFF">
      AMEVA
    </text>
    <rect x="4" y="24" width="460" height="8" rx="4" fill="url(#cyan-sky-grad)" />
    <text x="4" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#00F5D4">
      DYNAMIC ORGANIC MULTI-AGENT AUTOMATION
    </text>
  </g>
</svg>
